name: homescout

services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    networks:
      - homescout-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 1000s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        SUPABASE_PROJECT_URL: ${SUPABASE_PROJECT_URL}
        SUPABASE_PUBLIC_API_KEY: ${SUPABASE_PUBLIC_API_KEY}
        SITE_KEY_CAPTCHA: ${SITE_KEY_CAPTCHA}
        VITE_CAPTCHA_ENABLED: ${VITE_CAPTCHA_ENABLED:-false}
    ports:
      - "8443:8443"
      - "8080:8080"
    environment:
      BACKEND_UPSTREAM: http://backend:8000
    volumes:
      - ./backend/certs/localhost+1.pem:/etc/nginx/certs/cert.pem:ro
      - ./backend/certs/localhost+1-key.pem:/etc/nginx/certs/key.pem:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - homescout-net
    restart: unless-stopped

networks:
  homescout-net:
    name: homescout-net
    driver: bridge
